[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "passportiq-backend"
version = "2.0.0"
description = "PassPortIQ — Intelligent Passport Data Extraction System (Backend API, OCR, MRZ & VIZ Validation)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "PassPortIQ Engineering" }]
dependencies = [
    "fastapi>=0.111.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "rapidocr-onnxruntime>=1.3.15,<2.0.0",
    "onnxruntime>=1.17.0,<2.0.0",
    "opencv-python-headless>=4.9.0,<5.0.0",
    "Pillow>=10.3.0,<12.0.0",
    "numpy>=1.26.0,<3.0.0",
]

[project.optional-dependencies]
tesseract = [
    "pytesseract>=0.3.10,<1.0.0",
]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.6,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.4.4,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
