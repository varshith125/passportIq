name: Build and Release PassportIQ Desktop GUI

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows GUI (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Single Page App
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pywebview fastapi uvicorn pydantic pydantic-settings python-multipart rapidocr-onnxruntime onnxruntime opencv-python-headless Pillow numpy

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm passportiq.spec

      - name: Package Release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/PassportIQ -DestinationPath dist/PassportIQ-Windows-x64.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassportIQ-Windows-x64
          path: dist/PassportIQ-Windows-x64.zip

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: PassPortIQ v2.0 Desktop Release
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/PassportIQ-Windows-x64.zip
            dist/PassportIQ/PassportIQ.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
